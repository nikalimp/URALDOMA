# Разовая правка опубликованных постов Telegram-канала: убрать Instant View и ссылку в тексте,
# оставить кнопку «Читать полностью на сайте» (scripts/channels-edit.mjs). Запуск — вручную:
# сначала apply = false (список постов в Summary), затем apply = true.
name: Channels edit
on:
  workflow_dispatch:
    inputs:
      apply: { description: "Отредактировать посты (false — только показать)", type: boolean, default: false }
jobs:
  edit:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node scripts/channels-edit.mjs ${{ inputs.apply && '--apply' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEDIA_BRAND: content/factory/brand.json
