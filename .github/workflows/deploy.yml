# Выкладка uraldoma.ru — вызов общего сценария nikalimp/deploy-kit (стандарт «Публикация — стандарт»).
# Порядок: SSH (rsync) → если не прошёл, FTP → если упали оба, сборка в артефакте site-build.
# Перед выкладкой deploy-kit запускает npm run check: сайт с TODO или проваленной проверкой на прод не попадёт.
# Значения with: повторяют publish.json. Секреты (Settings → Secrets and variables → Actions):
#   FTP_HOST, FTP_USER, FTP_PASS, FTP_DIR = www/uraldoma.ru/ — обязательны: у REG.RU порт 22 закрыт для IP GitHub;
#   SSH_KEY, SSH_HOST, SSH_USER, SITE_DIR — можно оставить: когда порт откроют, выкладка пойдёт по SSH сама
#   (SITE_DIR для deploy-kit — абсолютный путь: /var/www/<логин>/data/www/uraldoma.ru/).
#
# Заявки: public/api/lead.php читает www/lead-config.php — уровнем выше папки сайта, выкладка его не трогает.
# Файл кладётся один раз руками (файловый менеджер REG.RU → www/). Текст файла:
#   TG_TOKEN=<токен бота> TG_CHATS=<id1,id2> MAIL_TO=<почта1,почта2> node scripts/lead-config.mjs > lead-config.php
# Прежний workflow (SSH + запись lead-config.php) — deploy.legacy.yml.disabled, удалить после зелёной выкладки.
name: Deploy
on:
  push:
    branches: [main]
    paths-ignore: ["specs/**", "*.md", "content/factory/**"]
  workflow_dispatch: {}
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  site:
    # без этой строки запуск падает со startup_failure: сценарий коммитит медиа обратно в репозиторий
    permissions: { contents: write }
    uses: nikalimp/deploy-kit/.github/workflows/site.yml@v1
    with:
      adapter: ssh-ftp
      site_dir: "."
      out_dir: out
      app_path: ""
      rsync_exclude: ""           # файлов, живущих только на сервере, внутри www/uraldoma.ru/ нет
      url: https://uraldoma.ru
    secrets: inherit
