# Боевая выкладка на uraldoma.ru — только вручную: Actions → «Deploy production» → Run workflow.
# Перед выкладкой npm run check: сайт с TODO, без фактов клиента или с geo-check < 8 на прод не попадёт.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   SSH_KEY       — приватный ключ деплоя (публичный — в ~/.ssh/authorized_keys на хостинге REG.RU)
#   SSH_HOST      — сервер хостинга (например, server123.hosting.reg.ru), SSH_USER — логин хостинга (u1234567)
#   SITE_DIR      — папка сайта со слешем на конце (например, www/uraldoma.ru/)
#   SITE_URL      — https://uraldoma.ru
#   TG_TOKEN, TG_CHATS (id через запятую), MAIL_TO (адреса через запятую) — для заявок, см. public/api/lead.php
name: Deploy production

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/indexnow.mjs prepare

      - name: SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          [ -z "$SSH_KEY" ] && { echo "::error::Нет секрета SSH_KEY"; exit 1; }
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Настройки заявок (lead-config.php рядом с папкой сайта)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SITE_DIR: ${{ secrets.SITE_DIR }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHATS: ${{ secrets.TG_CHATS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: node scripts/lead-config.mjs | ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "cat > \"\$(dirname \"$SITE_DIR\")/lead-config.php\" && chmod 600 \"\$(dirname \"$SITE_DIR\")/lead-config.php\""

      - name: Заливка (rsync по SSH)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SITE_DIR: ${{ secrets.SITE_DIR }}
        run: |
          # Не трогаем .well-known (SSL), cgi-bin
          rsync -az --delete --stats --exclude '.well-known/' --exclude 'cgi-bin/' \
            -e "ssh -i ~/.ssh/deploy_key -o ConnectTimeout=20" out/ "$SSH_USER@$SSH_HOST:$SITE_DIR"

      - name: Сайт отвечает
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          [ -z "$SITE_URL" ] && exit 0
          code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 20 "$SITE_URL/" || true)
          echo "$SITE_URL: $code"
          [ "$code" = "200" ] || { echo "::error::Сайт ответил $code"; exit 1; }

      - name: IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs submit
