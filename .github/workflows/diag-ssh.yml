# Временная диагностика: ключи подписи GitHub OIDC (JWKS) для приёмника выкладки по HTTPS. Ничего не выкладывает.
name: Diag SSH
on:
  pull_request:
    paths: [".github/workflows/diag-ssh.yml"]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: JWKS
        run: |
          j=$(curl -sS --max-time 20 https://token.actions.githubusercontent.com/.well-known/jwks | base64 -w0)
          echo "::notice title=jwks::${j}"
